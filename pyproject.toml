[project]
name = "term-todo"
version = "0.1.0"
description = "A terminal to-do list that can sync tasks to Google Calendar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["todo", "cli", "tui", "terminal", "google-calendar"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "textual>=0.80",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.0",
]

[project.urls]
Homepage = "https://github.com/bocho0600/term-todo"
Issues = "https://github.com/bocho0600/term-todo/issues"

[project.scripts]
term-todo = "term_todo.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["term_todo*"]
